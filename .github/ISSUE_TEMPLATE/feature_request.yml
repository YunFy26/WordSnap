name: 功能建议
description: 提议符合 WordSnap 产品边界的改进
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        WordSnap 优先保持功能范围有限和既有行为可靠。请先说明用户问题，再提出相应方案。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请说明使用者、使用场景和具体困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明最小可行方案，以及该方案如何与现有划词翻译流程衔接。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 请说明能否通过现有设置、外部工具或范围更小的变更解决该问题。
  - type: textarea
    id: impact
    attributes:
      label: 隐私与平台影响
      description: 请说明该建议是否影响网络请求、本地数据、剪贴板、快捷键或跨平台行为。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已检索现有 Issue，未发现相同建议。
          required: true
        - label: 我理解维护者可能基于项目范围拒绝扩展功能。
          required: true
